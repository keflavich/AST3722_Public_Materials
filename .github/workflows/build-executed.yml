name: build executed branch

# `master` holds the notebooks with their outputs stripped, so that diffs are
# readable. This workflow keeps the `executed` branch in step with it: same
# notebooks, but run, so nbviewer and the RISE slide links show plots.
#
# Notebooks the manifest marks `run` or `network` are executed here. The rest
# keep the outputs they already had -- they need observing data that isn't in
# the repository, or they are exercises with cells left blank for students.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-executed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master (stripped sources)
        uses: actions/checkout@v4
        with:
          ref: master
          path: stripped

      - name: Check out the executed branch
        uses: actions/checkout@v4
        with:
          ref: executed
          path: executed
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r stripped/requirements-test.txt

      - name: Rebuild
        env:
          MPLBACKEND: Agg
        run: |
          chmod +x stripped/tools/build_executed_branch.sh
          stripped/tools/build_executed_branch.sh stripped executed

      - name: Commit and push
        working-directory: executed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No change in the executed notebooks."
            exit 0
          fi
          subject=$(git -C ../stripped log -1 --pretty=%s)
          short=$(git -C ../stripped rev-parse --short HEAD)
          git commit -m "Rebuild from master ${short}: ${subject}" \
                     -m "Generated by .github/workflows/build-executed.yml. Do not edit this branch."
          git push origin HEAD:executed

      - name: Report which notebooks ran
        if: always()
        working-directory: stripped
        run: python tools/manifest.py
